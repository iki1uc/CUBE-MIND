<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CUBE-MIND · MIND-DASHBOARD</title>
<style>
body { font-family: Arial; background:#111; color:#eee; }
h1 { color:#6cf; }
.section { margin-bottom:20px; padding:10px; border:1px solid #333; }
</style>
</head>
<body>

<h1>CUBE-MIND · MIND-DASHBOARD</h1>

<div class="section">
  <h2>ID</h2>
  <p>MIND-ID: CUBE-MIND-01</p>
</div>

<div class="section">
  <h2>MASTER</h2>
  <button onclick="runMaster()">MASTER START</button>
  <pre id="masterOut"></pre>
</div>

<div class="section">
  <h2>PIPELINE 3/6/8/9/12</h2>
  <button onclick="runPipeline()">Pipeline ausführen</button>
  <pre id="pipeOut"></pre>
</div>

<div class="section">
  <h2>RAUM</h2>
  <button onclick="runRaum()">Raum laden</button>
  <pre id="raumOut"></pre>
</div>

<div class="section">
  <h2>EFFEKT</h2>
  <button onclick="runEffekt()">Effekt anwenden</button>
  <pre id="effOut"></pre>
</div>

<script type="module">
import { CUBEMIND } from "./MASTER/CUBE_MIND.js";
import { QI } from "./Pipeline 3/QI.js";
import { IQQ } from "./Pipeline 6/IQQ.js";
import { OCTA } from "./Pipeline 8/OCTA.js";
import { GRID9 } from "./Pipeline 9/9x9.js";
import { PIPE12 } from "./Pipeline 12/12e.js";
import { GEO } from "./Raum/GEO.js";
import { EFFECT } from "./Effekt/EFFECT.js";

window.runMaster = () => {
  document.getElementById("masterOut").innerText =
    JSON.stringify(CUBEMIND, null, 2);
};

window.runPipeline = () => {
  const out = {
    QI: QI(),
    IQQ: IQQ(),
    OCTA: OCTA(),
    GRID9: GRID9(),
    PIPE12: PIPE12()
  };
  document.getElementById("pipeOut").innerText =
    JSON.stringify(out, null, 2);
};

window.runRaum = () => {
  document.getElementById("raumOut").innerText =
    JSON.stringify(GEO(), null, 2);
};

window.runEffekt = () => {
  document.getElementById("effOut").innerText =
    JSON.stringify(EFFECT(), null, 2);
};
</script>

</body>
</html>
