<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CUBE-MIND · INDEX</title>
<style>
body { font-family: Arial; background:#111; color:#eee; }
h1 { color:#6cf; }
.section { margin-bottom:20px; padding:10px; border:1px solid #333; }
pre { background:#222; padding:10px; }
button { padding:10px; background:#6cf; border:none; color:#000; cursor:pointer; }
button:hover { background:#9ef; }
</style>
</head>
<body>

<h1>CUBE-MIND · INDEX · SHOW MUST BEGIN</h1>

<div class="section">
  <h2>QI (Pipeline 3)</h2>
  <pre id="qiOut">QI wird geladen…</pre>
</div>

<div class="section">
  <h2>IQQ (Pipeline 6)</h2>
  <pre id="iqqOut">IQQ wird geladen…</pre>
</div>

<div class="section">
  <h2>CONNECT · LAN · WLAN · WLOCH · ALLXALL</h2>
  <pre id="connectOut">CONNECT wird geladen…</pre>
</div>

<div class="section">
  <h2>SYNC · Langsamkeits-Regler</h2>
  <pre id="syncOut">SYNC aktiv…</pre>
</div>

<button onclick="startShow()">SHOW STARTEN</button>

<script type="module">
import { QI } from "./Pipeline 3/QI.js";
import { IQQ } from "./Pipeline 6/IQQ.js";
import { CONNECT } from "./CONNECT/CONNECT.js";
import { SYNC } from "./SYNC/SYNC.js";

window.startShow = async () => {

  // SYNC aktiv anzeigen
  document.getElementById("syncOut").innerText =
    "SYNC.delay = " + SYNC.delay + "ms (Pipeline verlangsamt)";

  // QI langsam ausführen
  const qi = await SYNC.slow(() => QI());
  const linkQI = CONNECT.link("C.room", "QI");

  document.getElementById("qiOut").innerText =
    JSON.stringify({ qi, linkQI }, null, 2);

  // IQQ langsam ausführen
  const iqq = await SYNC.slow(() => IQQ());
  const linkIQQ = CONNECT.link("C.room", "IQQ");

  document.getElementById("iqqOut").innerText =
    JSON.stringify({ iqq, linkIQQ }, null, 2);

  // CONNECT anzeigen
  document.getElementById("connectOut").innerText =
    JSON.stringify(CONNECT, null, 2);
};
</script>

</body>
</html>
